name: barcelona-b4-s4-weight-sensitivity
on:
  push:
    branches: [feature/b4-s4-feature-audit-20261101]
    paths:
      - scripts/audit_b4_s4_weight_sensitivity.py
      - .github/workflows/barcelona-b4-s4-weight-sensitivity.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - name: Restore validated B4-S4 checkpoint and real SUMO decision logs
        uses: actions/download-artifact@v4
        with:
          name: barcelona-b4-s4-sumo-pilot
          run-id: 41416190780
          github-token: ${{ github.token }}
          path: artifacts/barcelona_b4_s4
      - name: Quantify observed-state feature sensitivity
        run: PYTHONPATH=. python scripts/audit_b4_s4_weight_sensitivity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barcelona-b4-s4-weight-sensitivity
          path: artifacts/barcelona_b4_s4_ablation/weight_sensitivity.json
          if-no-files-found: warn
