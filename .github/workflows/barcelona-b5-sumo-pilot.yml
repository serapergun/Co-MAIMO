name: barcelona-b5-sumo-pilot
on:
  push:
    branches: [experiment/b5-sumo-pilot-20261024]
    paths:
      - ".github/workflows/barcelona-b5-sumo-pilot.yml"
      - "scripts/barcelona_b5_joint_pilot.py"
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/barcelona-b5-sumo-pilot.yml"
      - "scripts/barcelona_b5_joint_pilot.py"
jobs:
  b5-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned SUMO runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install numpy eclipse-sumo==1.27.1 sumolib==1.27.1 traci==1.27.1
          echo "$(python -c 'import sumo; print(sumo.SUMO_HOME)')/bin" >> "$GITHUB_PATH"
      - name: Build original Barcelona network
        run: python scripts/build_barcelona_network.py
      - name: Produce original B4 checkpoint (training seeds only)
        run: PYTHONPATH=. python scripts/barcelona_b4_mappo.py
      - name: Run frozen-actor B5 joint dispatch pilot (seed 9101)
        run: PYTHONPATH=. python scripts/barcelona_b5_joint_pilot.py
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barcelona-b5-pilot-9101
          path: |
            artifacts/barcelona_b5_pilot/
            artifacts/barcelona_b4_mappo/experiment_manifest.json
            artifacts/barcelona_b4_mappo/checkpoints/b4_mappo_final.npz.json
          if-no-files-found: warn
