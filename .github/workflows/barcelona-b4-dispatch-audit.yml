name: barcelona-b4-dispatch-audit
on:
  push:
    branches: [feature/b4-dispatch-decision-audit-20261031]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install numpy pandas matplotlib pytest eclipse-sumo==1.27.1 sumolib==1.27.1 traci==1.27.1
          echo "$(python -c 'import sumo; print(sumo.SUMO_HOME)')/bin" >> "$GITHUB_PATH"
      - name: Regression gate
        run: PYTHONPATH=. python -m pytest -q tests/test_core.py tests/test_coalition_game.py tests/test_evaluation.py tests/test_requests.py
      - name: Build fixed Barcelona network
        run: python scripts/build_barcelona_network.py
      - name: Restore frozen B4 checkpoint from validated Phase3A run
        uses: actions/download-artifact@v4
        with:
          name: phase3a-b4
          run-id: 41068558828
          github-token: ${{ github.token }}
          path: artifacts
      - name: Audit held-out B4 taxi decisions
        run: PYTHONPATH=. python scripts/barcelona_b4_dispatch_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b4-dispatch-decision-audit
          path: artifacts/b4_dispatch_audit/
          if-no-files-found: warn
