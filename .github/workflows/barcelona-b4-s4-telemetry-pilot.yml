name: barcelona-b4-s4-telemetry-pilot
on:
  push:
    branches: [feature/b4-s4-feature-audit-20261101]
    paths:
      - scripts/barcelona_b4_s4_telemetry_pilot.py
      - .github/workflows/barcelona-b4-s4-telemetry-pilot.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  sumo-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned SUMO and Python dependencies
        run: |
          sudo add-apt-repository -y ppa:sumo/stable
          sudo apt-get update
          sudo apt-get install -y sumo sumo-tools
          python -m pip install numpy scipy sumolib traci pytest
          sumo --version
      - name: Download validated Barcelona network
        uses: actions/download-artifact@v4
        with:
          name: phase3a-validated
          run-id: 41068558828
          github-token: ${{ github.token }}
          path: artifacts
      - name: Download frozen B4-S3 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: barcelona-b4-s3-sumo-pilot
          run-id: 41321108475
          github-token: ${{ github.token }}
          path: artifacts/barcelona_b4_s3
      - name: Validate telemetry unit tests
        run: PYTHONPATH=. python -m pytest -q tests/test_telemetry_probes.py
      - name: Probe actual Barcelona SUMO telemetry
        run: PYTHONPATH=. python scripts/barcelona_b4_s4_telemetry_pilot.py
      - name: Archive raw telemetry and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barcelona-b4-s4-telemetry-pilot
          path: artifacts/barcelona_b4_s4_telemetry/
          if-no-files-found: warn
