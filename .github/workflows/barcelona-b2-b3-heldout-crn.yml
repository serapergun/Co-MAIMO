name: barcelona-b2-b3-heldout-crn
on:
  workflow_dispatch:
  push:
    branches:
      - feature/b2-b3-heldout-crn-20261030
    paths:
      - '.github/workflows/barcelona-b2-b3-heldout-crn.yml'
      - 'scripts/barcelona_b2_b3_heldout.py'
      - 'src/baselines/b2_b3_dispatch.py'
jobs:
  b2b3:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install numpy pandas matplotlib pytest eclipse-sumo==1.27.1 sumolib==1.27.1 traci==1.27.1
          echo "$(python -c 'import sumo; print(sumo.SUMO_HOME)')/bin" >> "$GITHUB_PATH"
      - name: Regression gate
        run: PYTHONPATH=. python -m pytest -q tests/test_core.py tests/test_coalition_game.py tests/test_evaluation.py tests/test_requests.py
      - name: Build fixed Barcelona network
        run: python scripts/build_barcelona_network.py
      - name: Evaluate B2 and B3 held-out CRN
        run: PYTHONPATH=. python scripts/barcelona_b2_b3_heldout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barcelona-b2-b3-heldout-crn
          path: artifacts/barcelona_b2_b3_heldout/
