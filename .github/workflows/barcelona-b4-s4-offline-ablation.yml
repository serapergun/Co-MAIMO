name: barcelona-b4-s4-offline-ablation
on:
  push:
    branches: [feature/b4-s4-feature-audit-20261101]
    paths:
      - scripts/audit_b4_s4_ablation.py
      - .github/workflows/barcelona-b4-s4-offline-ablation.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - name: Restore real B4-S4 decisions and frozen checkpoint
        uses: actions/download-artifact@v4
        with:
          name: barcelona-b4-s4-sumo-pilot
          run-id: 41416190780
          github-token: ${{ github.token }}
          path: artifacts/barcelona_b4_s4
      - name: Run controlled offline ablation
        run: PYTHONPATH=. python scripts/audit_b4_s4_ablation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barcelona-b4-s4-offline-ablation
          path: artifacts/barcelona_b4_s4_ablation/
          if-no-files-found: warn
