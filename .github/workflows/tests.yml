name: core-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy PyYAML pytest
      - run: python -m pytest -q tests/test_core.py tests/test_requests.py tests/test_emef_gate.py tests/test_evaluation.py tests/test_energy_metrics.py
