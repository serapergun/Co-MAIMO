name: b4-shared-score-prototype-tests
on:
  push:
    branches: [feature/b4-shared-score-policy-prototype-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pytest
      - name: Shared score policy tests
        run: PYTHONPATH=. python -m pytest -q tests/test_shared_score_policy.py
