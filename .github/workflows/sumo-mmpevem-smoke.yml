name: sumo-mmpevem-smoke
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/sumo-mmpevem-smoke.yml"
      - "scripts/mmpevem_smoke.py"
      - "scripts/analyze_mmpevem.py"
      - "src/evaluation/energy_metrics.py"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SUMO
        run: |
          python -m pip install --upgrade pip
          pip install eclipse-sumo==1.27.1 pandas
      - name: Run physical MMPEVEM smoke test
        run: python scripts/mmpevem_smoke.py
      - name: Analyze physical energy
        run: python scripts/analyze_mmpevem.py --tripinfo artifacts/mmpevem_smoke/tripinfo.xml --out artifacts/mmpevem_smoke/energy_metrics.json
      - name: Show result
        run: cat artifacts/mmpevem_smoke/energy_metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: mmpevem-smoke-results
          path: artifacts/mmpevem_smoke/
