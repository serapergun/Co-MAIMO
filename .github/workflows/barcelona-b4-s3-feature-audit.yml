name: barcelona-b4-s3-feature-audit
on:
  push:
    branches: [feature/b4-s4-feature-audit-20261101]
    paths:
      - scripts/audit_b4_s3_features.py
      - src/marl/telemetry_probes.py
      - tests/test_telemetry_probes.py
      - .github/workflows/barcelona-b4-s3-feature-audit.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pytest
      - name: Audit regression tests
        run: PYTHONPATH=. python -m pytest -q tests/test_b4_s3_feature_audit.py tests/test_telemetry_probes.py
      - name: Download real B4-S3 SUMO artifacts
        uses: actions/download-artifact@v4
        with:
          name: barcelona-b4-s3-sumo-pilot
          run-id: 41321108475
          github-token: ${{ github.token }}
          path: artifacts/barcelona_b4_s3
      - name: Audit decision records
        run: PYTHONPATH=. python scripts/audit_b4_s3_features.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barcelona-b4-s3-feature-audit
          path: artifacts/barcelona_b4_s3_audit/
          if-no-files-found: warn
