name: barcelona-b4-s4-decision-audit
on:
  push:
    branches: [feature/b4-s4-feature-audit-20261101]
    paths:
      - scripts/audit_b4_s4_decisions.py
      - .github/workflows/barcelona-b4-s4-decision-audit.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - name: Download B4-S3 heldout decisions
        uses: actions/download-artifact@v4
        with:
          name: barcelona-b4-s3-sumo-pilot
          run-id: 41321108475
          github-token: ${{ github.token }}
          path: artifacts/barcelona_b4_s3
      - name: Download B4-S4 heldout decisions
        uses: actions/download-artifact@v4
        with:
          name: barcelona-b4-s4-sumo-pilot
          run-id: 41416190780
          github-token: ${{ github.token }}
          path: artifacts/barcelona_b4_s4
      - name: Audit paired assignments and telemetry coverage
        run: PYTHONPATH=. python scripts/audit_b4_s4_decisions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barcelona-b4-s4-decision-audit
          path: artifacts/barcelona_b4_s4_audit/
          if-no-files-found: warn
