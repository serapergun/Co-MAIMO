name: barcelona-b4-s3-paired-inference-v2
on:
  push:
    branches: [feature/b4-s3-paired-inference-20261101]
    paths:
      - scripts/compare_b4_s3_paired.py
      - .github/workflows/barcelona-b4-s3-paired-inference.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  paired-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - name: Download validated Phase3A baselines
        uses: actions/download-artifact@v4
        with:
          name: phase3a-validated
          run-id: 41068558828
          github-token: ${{ github.token }}
          path: artifacts
      - name: Download B4-G heldout
        uses: actions/download-artifact@v4
        with:
          name: barcelona-b4-greedy-heldout
          run-id: 41215770543
          github-token: ${{ github.token }}
          path: artifacts/barcelona_b4_greedy
      - name: Download validated B4-S2
        uses: actions/download-artifact@v4
        with:
          name: barcelona-b4-stabilized-sumo-pilot
          run-id: 41302415270
          github-token: ${{ github.token }}
          path: artifacts/barcelona_b4_stabilized
      - name: Download validated B4-S3
        uses: actions/download-artifact@v4
        with:
          name: barcelona-b4-s3-sumo-pilot
          run-id: 41321108475
          github-token: ${{ github.token }}
          path: artifacts/barcelona_b4_s3
      - name: Verify input metrics exist
        run: |
          find artifacts -name heldout_metrics.json -print
      - name: Compute paired inference
        run: PYTHONPATH=. python scripts/compare_b4_s3_paired.py
      - name: Upload inference outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barcelona-b4-s3-paired-inference
          path: artifacts/barcelona_b4_s3_inference/
          if-no-files-found: warn
