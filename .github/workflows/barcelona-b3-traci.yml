name: barcelona-b3-traci
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/barcelona-b3-traci.yml"
      - "scripts/barcelona_b3_traci.py"
      - "scripts/build_barcelona_network.py"
      - "src/baselines/b1_dispatch.py"
      - "src/simulation/traci_runner.py"
      - "src/evaluation/parse_mmpevem_emissions.py"
jobs:
  b3:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install pinned runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          pip install eclipse-sumo==1.27.1 sumolib==1.27.1 traci==1.27.1
          echo "$(python -c 'import sumo; print(sumo.SUMO_HOME)')/bin" >> "$GITHUB_PATH"
      - name: Build fixed-snapshot Barcelona preflight network
        run: python scripts/build_barcelona_network.py
      - name: Run B3 four-taxi staggered lifecycle
        run: PYTHONPATH=. python scripts/barcelona_b3_traci.py
      - name: Validate B3 scale lifecycle and physical energy
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          from src.evaluation.parse_mmpevem_emissions import mmpevem_emission_energy
          r=Path("artifacts/barcelona_b3_traci")
          q=json.loads((r/"request_qc.json").read_text())
          assigned=q["assigned_reservations"]
          if len(assigned)!=8 or len(set(assigned))!=8: raise SystemExit(f"expected 8 unique assigned reservations: {q}")
          if q["duplicate_assignments"]: raise SystemExit(f"duplicate assignments: {q['duplicate_assignments']}")
          if q["final_active_reservations"] or q["remaining_persons"]: raise SystemExit(f"unresolved requests/persons: {q}")
          if q["teleported_vehicle_ids"]: raise SystemExit(f"teleport detected: {q['teleported_vehicle_ids']}")
          expected={f"taxi{i}" for i in range(4)}
          if not expected.issubset(set(q["pickup_taxi_ids"])): raise SystemExit(f"not all taxis entered pickup: {q}")
          if not expected.issubset(set(q["occupied_taxi_ids"])): raise SystemExit(f"not all taxis entered occupied: {q}")
          for taxi in expected:
              if float(q["occupied_distance_m_by_taxi"].get(taxi,0))<=0: raise SystemExit(f"{taxi} non-positive occupied distance: {q}")
          trips=ET.parse(r/"tripinfo.xml").getroot().findall("tripinfo")
          taxis=[t for t in trips if t.get("id") in expected]
          if len(taxis)!=4: raise SystemExit(f"expected four taxi tripinfos, got {len(taxis)}")
          dist=sum(float(t.get("routeLength","0")) for t in taxis)/1000
          if dist<=0: raise SystemExit("non-positive fleet vehicle-km")
          m=mmpevem_emission_energy(r/"emissions.xml")
          if m["net_energy_kWh"]<=0: raise SystemExit("non-positive net MMPEVEM energy")
          m["fleet_vehicle_km"]=dist; m["kWh_per_vehicle_km"]=m["net_energy_kWh"]/dist
          (r/"validated_metrics.json").write_text(json.dumps(m,indent=2))
          print(json.dumps({"request_qc":q,"energy":m},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barcelona-b3-traci
          path: artifacts/barcelona_b3_traci/
